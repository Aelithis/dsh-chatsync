name: ChatSync Private 双平台验证
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
      - run: npm ci --ignore-scripts
      - name: 验证 Windows Git 隔离与恢复记录
        if: runner.os == 'Windows'
        run: node --test tests/generic-remote.test.mjs tests/local-history.test.mjs tests/private-project-mappings.test.mjs
      - name: 隔离回归与打包检查
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          npm test
          npm exec -- node scripts/check-package-contents.mjs
